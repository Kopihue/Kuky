[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "kuky"
version = "0.1.0"
description = "Profile switcher for window managers"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "kopilogs == 0.1.0"
]

[project.scripts]
kuky = "kuky.main:main"
